<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – Envara Ventures</title>
  <link href="https://fonts.cdnfonts.com/css/geist" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <div class="wrapper navbar">
      <a class="logo" href="index.html">
        <div class="logo-mark">EV</div>
        Envara Ventures
      </a>
      <nav class="nav-links">
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="nav-actions">
        <a href="cart.html" class="button secondary">Cart <span class="cart-count">0</span></a>
        <a href="admin.html" class="button">Admin</a>
      </div>
    </div>
  </header>
  <main class="wrapper">
    <section class="page-hero">
      <h1>Contact</h1>
      <p class="section-subtitle">We keep communication minimal and clear.</p>
    </section>
    <section class="layout-two">
      <form class="card" data-contact-form>
        <div class="form-grid">
          <div>
            <label for="name">Full name</label>
            <input required type="text" id="name" name="name" placeholder="Jordan Lee">
          </div>
          <div>
            <label for="email">Email</label>
            <input required type="email" id="email" name="email" placeholder="you@example.com">
          </div>
        </div>
        <label for="message">Message</label>
        <textarea required id="message" name="message" placeholder="Tell us about your project or request"></textarea>
        <button class="button" type="submit">Send message</button>
      </form>
      <div class="card">
        <h3>Support</h3>
        <p class="badge-muted">Email</p>
        <p>support@envaraventures.com</p>
        <p class="badge-muted">Hours</p>
        <p>Monday–Friday, 9am–6pm</p>
      </div>
    </section>
  </main>
  <footer class="footer">
    <div class="wrapper footer-content">
      <div>Envara Ventures</div>
      <div class="footer-links">
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms & Conditions</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
  </footer>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
