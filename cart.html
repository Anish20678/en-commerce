<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart – Envara Ventures</title>
  <link href="https://fonts.cdnfonts.com/css/geist" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <div class="wrapper navbar">
      <a class="logo" href="index.html">
        <div class="logo-mark">EV</div>
        Envara Ventures
      </a>
      <nav class="nav-links">
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="nav-actions">
        <a href="cart.html" class="button secondary">Cart <span class="cart-count">0</span></a>
        <a href="admin.html" class="button">Admin</a>
      </div>
    </div>
  </header>
  <main class="wrapper">
    <section class="page-hero">
      <h1>Your Cart</h1>
      <p class="section-subtitle">Minimal, distraction-free checkout ready.</p>
    </section>
    <section class="layout-two">
      <div>
        <table class="cart-table">
          <thead>
            <tr><th>Item</th><th>Price</th><th>Qty</th><th>Total</th><th></th></tr>
          </thead>
          <tbody data-cart-items></tbody>
        </table>
      </div>
      <div class="cart-summary">
        <h3>Summary</h3>
        <p class="badge-muted">Subtotal</p>
        <h2 data-cart-summary>$0.00</h2>
        <a href="checkout.html" class="button" style="width:100%; text-align:center;">Proceed to checkout</a>
      </div>
    </section>
  </main>
  <footer class="footer">
    <div class="wrapper footer-content">
      <div>Envara Ventures</div>
      <div class="footer-links">
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms & Conditions</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
  </footer>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
